<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jätskiauto Helsinki Metro</title>
  <!-- Open Graph (social sharing preview) -->
  <meta property="og:title"       content="Jätskiauto Helsinki Metro 🍦" />
  <meta property="og:description" content="Interactive map of ice cream truck routes across Helsinki, Espoo and Vantaa. 152 routes, live truck tracking." />
  <meta property="og:type"        content="website" />
  <meta name="twitter:card"       content="summary" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <style>
    /* ── Vice City Palette ───────────────────────────────────────────────────
       Hot pink / cyan neon on near-black purple
       Active routes:  hot pink  #ff2e97
       Inactive routes: steel blue #1e5ab4  (visible, distinct)
       Accents: cyan #00e5ff, purple #9b2dff, gold #ffe600
    ─────────────────────────────────────────────────────────────────────── */
    :root {
      --bg:       #0d0b1e;
      --surface:  rgba(13, 7, 45, 0.93);
      --border:   rgba(255, 46, 151, 0.22);
      --active:   #ff2e97;
      --cyan:     #00e5ff;
      --purple:   #9b2dff;
      --gold:     #ffe600;
      --inactive: #1e5ab4;
      --text:     #f5eeff;
      --muted:    rgba(245, 238, 255, 0.45);
      --radius:   12px;
      --font:     'Nunito', system-ui, sans-serif;
      --font-head:'Orbitron', 'Nunito', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; background: var(--bg); font-family: var(--font); }

    /* ── Leaflet ── */
    .leaflet-control-attribution {
      background: rgba(13,7,45,0.7) !important;
      color: rgba(245,238,255,0.3) !important;
      font-size: 10px !important;
    }
    .leaflet-control-attribution a { color: rgba(255,46,151,0.55) !important; }
    .leaflet-control-zoom a {
      background: var(--surface) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
      backdrop-filter: blur(12px);
    }
    .leaflet-control-zoom a:hover {
      background: rgba(255,46,151,0.18) !important;
      box-shadow: 0 0 14px rgba(255,46,151,0.3) !important;
    }

    /* ── Glass base ── */
    .glass {
      background: var(--surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 6px 28px rgba(0,0,0,.55),
                  inset 0 1px 0 rgba(255,255,255,.04),
                  0 0 0 1px rgba(255,46,151,.06);
    }

    /* ── Title bar ── */
    .ctrl-title {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      user-select: none;
      min-width: 220px;
    }
    .title-left { display: flex; flex-direction: column; gap: 2px; }
    .title-text {
      font-family: var(--font-head);
      font-size: 14px; font-weight: 900;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--text);
      text-shadow: 0 0 18px rgba(255,46,151,0.65);
      white-space: nowrap;
    }
    .title-text .ice  { color: var(--active); }
    .title-text .cyan { color: var(--cyan); }
    .meta-updated {
      font-family: var(--font);
      font-size: 9px; color: var(--muted); letter-spacing: 0.2px;
    }
    .gh-link {
      font-family: var(--font);
      font-size: 9px; color: var(--muted); letter-spacing: 0.2px;
      text-decoration: none; opacity: 0.7;
      transition: opacity .18s, color .18s;
    }
    .gh-link:hover { opacity: 1; color: var(--cyan); }

    /* ── Language toggle ── */
    .btn-lang {
      font-family: var(--font-head);
      font-size: 10px; font-weight: 700; letter-spacing: 1px;
      color: var(--muted);
      border: 1px solid rgba(255,46,151,0.25);
      border-radius: 8px; padding: 5px 10px;
      cursor: pointer; white-space: nowrap;
      transition: color .18s, border-color .18s, box-shadow .18s;
      background: transparent;
    }
    .btn-lang:hover {
      color: var(--active);
      border-color: rgba(255,46,151,0.5);
      box-shadow: 0 0 10px rgba(255,46,151,0.2);
    }
    .btn-lang .al { color: var(--active); }

    /* ── Address search ── */
    .ctrl-search { padding: 9px 11px; min-width: 220px; position: relative; }
    .search-row { display: flex; gap: 6px; }
    .search-input {
      flex: 1;
      font-family: var(--font); font-size: 13px; font-weight: 600;
      color: var(--text);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,46,151,0.2);
      border-radius: 8px; padding: 6px 10px; outline: none;
      transition: border-color .18s, box-shadow .18s;
    }
    .search-input::placeholder { color: var(--muted); font-weight: 400; }
    .search-input:focus {
      border-color: rgba(0,229,255,0.45);
      box-shadow: 0 0 12px rgba(0,229,255,0.12);
    }
    .search-btn {
      width: 32px; height: 32px; flex-shrink: 0;
      border-radius: 8px;
      background: rgba(255,46,151,0.12);
      border: 1px solid rgba(255,46,151,0.3);
      color: var(--active); font-size: 14px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .18s, box-shadow .18s;
    }
    .search-btn:hover { background: rgba(255,46,151,0.22); box-shadow: 0 0 12px rgba(255,46,151,0.25); }
    .search-results {
      position: absolute; top: 100%; left: 11px; right: 11px; z-index: 9000;
    }
    .search-result-item {
      padding: 7px 11px; font-size: 12px; color: var(--text);
      cursor: pointer;
      background: rgba(13,7,45,0.96); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,46,151,0.15);
      border-top: none;
      transition: background .14s;
    }
    .search-result-item:first-child { border-top: 1px solid rgba(255,46,151,0.15); border-radius: 8px 8px 0 0; }
    .search-result-item:last-child  { border-radius: 0 0 8px 8px; }
    .search-result-item:only-child  { border-radius: 8px; border-top: 1px solid rgba(255,46,151,0.15); }
    .search-result-item:hover       { background: rgba(255,46,151,0.14); color: var(--active); }
    .search-result-name { font-weight: 700; }
    .search-result-sub  { font-size: 10px; color: var(--muted); margin-top: 1px; }

    /* ── Date panel ── */
    .ctrl-datepanel { padding: 12px 14px; min-width: 200px; }
    .ctrl-datepanel .panel-title {
      font-family: var(--font-head);
      font-size: 9px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.4px;
      color: var(--muted); margin-bottom: 8px;
    }
    .ctrl-datepanel input[type="date"] {
      width: 100%; font-family: var(--font);
      font-size: 14px; font-weight: 700; color: var(--text);
      border: 1px solid rgba(255,46,151,0.25); border-radius: 8px;
      padding: 7px 10px; outline: none; cursor: pointer;
      background: rgba(255,255,255,0.05);
      transition: border-color .18s, box-shadow .18s; color-scheme: dark;
    }
    .ctrl-datepanel input[type="date"]:focus {
      border-color: rgba(0,229,255,0.45);
      box-shadow: 0 0 12px rgba(0,229,255,0.12);
    }
    .ctrl-datepanel .route-count {
      font-size: 13px; color: var(--muted); margin-top: 7px; min-height: 18px;
    }
    .ctrl-datepanel .route-count strong { color: var(--active); }

    /* ── Live button ── */
    .btn-live {
      display: flex; align-items: center; gap: 7px;
      border: 1px solid rgba(255,46,151,0.35); border-radius: 12px;
      padding: 8px 14px; font-family: var(--font);
      font-size: 13px; font-weight: 700; color: var(--active);
      cursor: pointer;
      transition: background .18s, transform .14s, box-shadow .18s;
      white-space: nowrap;
    }
    .btn-live:hover:not(.is-today) {
      background: rgba(255,46,151,0.12); transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(255,46,151,0.3), 0 0 30px rgba(255,46,151,0.12);
    }
    .btn-live.is-today { color: var(--muted); border-color: rgba(255,255,255,0.1); cursor: default; }
    .pulse-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--active); box-shadow: 0 0 8px rgba(255,46,151,0.8);
      animation: live-pulse 1.5s ease-in-out infinite; flex-shrink: 0;
    }
    .btn-live.is-today .pulse-dot { background: var(--muted); box-shadow: none; animation: none; }
    @keyframes live-pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.3; transform:scale(.6); }
    }

    /* ── Geolocation button ── */
    .btn-geo {
      width: 42px; height: 42px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; cursor: pointer;
      border: 1px solid rgba(0,229,255,0.35);
      transition: background .18s, transform .14s, box-shadow .18s;
    }
    .btn-geo:hover {
      background: rgba(0,229,255,0.12) !important; transform: scale(1.12);
      box-shadow: 0 0 18px rgba(0,229,255,0.3);
    }
    .btn-geo:active { transform: scale(.92); }

    /* ── Stop dots ── */
    .stop-dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--active);
      box-shadow: 0 0 0 3px rgba(255,46,151,0.2), 0 0 12px rgba(255,46,151,0.5);
      transition: transform .18s, box-shadow .18s; cursor: pointer;
    }
    .stop-dot:hover {
      transform: scale(1.8);
      box-shadow: 0 0 0 4px rgba(255,46,151,0.3), 0 0 22px rgba(255,46,151,0.8);
    }
    .stop-dot.inactive {
      background: var(--inactive); opacity: 0.55; box-shadow: none;
    }
    .stop-dot.inactive:hover {
      transform: scale(1.5); opacity: 0.85;
      box-shadow: 0 0 10px rgba(30,90,180,0.5);
    }
    .stop-dot.soon {
      background: #ff85c8;
      box-shadow: 0 0 0 3px rgba(255,133,200,0.28), 0 0 14px rgba(255,133,200,0.7);
      animation: soon-pulse 2s ease-in-out infinite;
    }
    .stop-dot.now {
      background: var(--gold);
      box-shadow: 0 0 0 4px rgba(255,230,0,0.28), 0 0 18px rgba(255,230,0,0.7);
      animation: now-pulse 1s ease-in-out infinite;
    }
    .stop-dot.past { background: #ff2e97; opacity: 0.22; box-shadow: none; }
    @keyframes soon-pulse {
      0%,100% { box-shadow: 0 0 0 3px rgba(255,133,200,.28), 0 0 14px rgba(255,133,200,.7); }
      50%      { box-shadow: 0 0 0 6px rgba(255,133,200,.12), 0 0 22px rgba(255,133,200,.45); }
    }
    @keyframes now-pulse {
      0%,100% { box-shadow: 0 0 0 4px rgba(255,230,0,.28), 0 0 18px rgba(255,230,0,.7); transform: scale(1); }
      50%      { box-shadow: 0 0 0 8px rgba(255,230,0,.14), 0 0 28px rgba(255,230,0,.45); transform: scale(1.25); }
    }

    /* ── Truck marker ── */
    .truck-marker {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, #ff2e97, #00e5ff);
      border-radius: 50%; border: 2.5px solid rgba(255,255,255,0.85);
      box-shadow: 0 0 0 4px rgba(255,46,151,.22), 0 0 22px rgba(255,46,151,.5), 0 4px 16px rgba(0,0,0,.5);
      display: flex; align-items: center; justify-content: center; font-size: 18px;
      animation: truck-bounce 1.8s ease-in-out infinite;
    }
    @keyframes truck-bounce {
      0%,100% { transform: translateY(0) scale(1); }
      40%      { transform: translateY(-5px) scale(1.08); }
      60%      { transform: translateY(-3px) scale(1.05); }
    }

    /* ── Popup ── */
    .leaflet-popup-content-wrapper {
      background: rgba(13,7,45,0.96) !important;
      backdrop-filter: blur(20px) !important; -webkit-backdrop-filter: blur(20px) !important;
      border: 1px solid rgba(255,46,151,0.25) !important;
      border-radius: 14px !important;
      box-shadow: 0 8px 32px rgba(0,0,0,.7), 0 0 0 1px rgba(255,46,151,.08) !important;
      padding: 0 !important; overflow: hidden; animation: popup-in .2s ease;
    }
    @keyframes popup-in {
      from { opacity:0; transform:translateY(6px) scale(.97); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }
    .leaflet-popup-content { margin: 0 !important; width: auto !important; }
    .leaflet-popup-tip-container { display: none; }
    .leaflet-popup-close-button { color: var(--muted) !important; font-size: 18px !important; padding: 6px 8px !important; }
    .leaflet-popup-close-button:hover { color: var(--active) !important; }

    .popup-stop { font-family: var(--font); min-width: 200px; }
    .popup-header {
      background: linear-gradient(135deg, rgba(255,46,151,.18), rgba(155,45,255,.14));
      border-bottom: 1px solid rgba(255,46,151,.14); padding: 11px 15px 9px;
    }
    .popup-header .stop-name { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.2; }
    .popup-header .stop-zip { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .popup-body { padding: 10px 15px 13px; }

    .popup-time-box { border-radius: 9px; padding: 7px 11px; margin-bottom: 9px; }
    .popup-time-box.today    { background: rgba(255,46,151,.1); border: 1px solid rgba(255,46,151,.3); }
    .popup-time-box.other-day{ background: rgba(0,229,255,.07); border: 1px solid rgba(0,229,255,.25); }
    .tbox-label { font-size: 9px; font-weight: 700; font-family: var(--font-head); text-transform: uppercase; letter-spacing: 1px; }
    .popup-time-box.today     .tbox-label { color: var(--active); }
    .popup-time-box.other-day .tbox-label { color: var(--cyan); }
    .tbox-time { font-size: 22px; font-weight: 800; line-height: 1; font-family: var(--font-head); }
    .popup-time-box.today     .tbox-time { color: var(--active); text-shadow: 0 0 12px rgba(255,46,151,.5); }
    .popup-time-box.other-day .tbox-time { color: var(--cyan); text-shadow: 0 0 12px rgba(0,229,255,.5); }

    .popup-upcoming .upcoming-title {
      font-size: 9px; font-weight: 700; font-family: var(--font-head);
      text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 5px;
    }
    .popup-upcoming .upcoming-row {
      display: flex; justify-content: space-between; gap: 12px;
      font-size: 12px; color: rgba(245,238,255,.6); padding: 3px 0;
      border-bottom: 1px solid rgba(255,46,151,.08);
    }
    .popup-upcoming .upcoming-row:last-child { border-bottom: none; }
    .popup-phone { margin-top: 8px; font-size: 12px; color: rgba(245,238,255,.32); }
    .popup-copy-btn {
      display: block; width: 100%; margin-top: 9px; padding: 6px 10px;
      background: rgba(255,46,151,.07); border: 1px solid rgba(255,46,151,.2);
      border-radius: 8px; color: var(--muted); font-family: var(--font);
      font-size: 12px; cursor: pointer; text-align: center;
      transition: background .14s, color .14s, box-shadow .14s;
    }
    .popup-copy-btn:hover { background: rgba(255,46,151,.16); color: var(--active); box-shadow: 0 0 10px rgba(255,46,151,.18); }

    /* ── Truck popup ── */
    .popup-truck { font-family: var(--font); min-width: 180px; }
    .popup-truck strong { font-family: var(--font-head); font-size: 12px; letter-spacing: 1px; color: var(--active); display: block; margin-bottom: 7px; }
    .truck-status { font-size: 13px; font-weight: 700; color: var(--text); padding: 6px 0 4px; border-bottom: 1px solid rgba(255,46,151,.12); margin-bottom: 6px; }
    .truck-status span { font-size: 11px; font-weight: 400; color: var(--muted); }
    .truck-upcoming { display: flex; flex-direction: column; gap: 3px; }
    .truck-upcoming div { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: rgba(245,238,255,.6); padding: 2px 0; border-bottom: 1px solid rgba(255,46,151,.06); }
    .truck-upcoming div:last-child { border-bottom: none; }
    .truck-upcoming div span:last-child { color: var(--muted); white-space: nowrap; }

    /* ── Past visit (today) ── */
    .popup-time-box.today-past { background: rgba(255,46,151,.03); border: 1px solid rgba(255,46,151,.1); }
    .popup-time-box.today-past .tbox-label { color: rgba(255,46,151,.45); }
    .popup-time-box.today-past .tbox-time  { color: rgba(255,46,151,.45); text-shadow: none; }

    /* ── Tooltip ── */
    .leaflet-tooltip {
      background: rgba(13,7,45,.92) !important; backdrop-filter: blur(10px);
      border: 1px solid rgba(255,46,151,.22) !important; border-radius: 8px !important;
      color: var(--text) !important; font-family: var(--font) !important;
      font-size: 12px !important; box-shadow: 0 4px 14px rgba(0,0,0,.5) !important;
    }
    .leaflet-tooltip-top::before { border-top-color: rgba(13,7,45,.92) !important; }

    /* ── Loading overlay ── */
    #loading-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: #0d0b1e;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      transition: opacity 0.5s ease;
    }
    #loading-overlay.fade-out { opacity: 0; pointer-events: none; }
    .lo-title {
      font-family: var(--font-head); font-size: 26px; font-weight: 900;
      color: var(--active); letter-spacing: 3px;
      text-shadow: 0 0 30px rgba(255,46,151,0.75);
    }
    .lo-sub { font-size: 13px; color: rgba(0,229,255,0.65); letter-spacing: 2px; }
    .lo-bar { width: 160px; height: 2px; background: rgba(255,46,151,0.18); border-radius: 2px; overflow: hidden; }
    .lo-bar-inner {
      height: 100%; background: var(--active);
      box-shadow: 0 0 8px rgba(255,46,151,0.8);
      animation: lo-slide 1.2s ease-in-out infinite;
    }
    @keyframes lo-slide {
      0%   { width:0%;  margin-left:0%; }
      50%  { width:55%; margin-left:22%; }
      100% { width:0%;  margin-left:100%; }
    }

    /* ── Marker clusters ── */
    .jatski-cluster {
      background: rgba(13,7,45,0.92); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-head); font-weight: 700; backdrop-filter: blur(8px);
    }
    .jatski-cluster.has-active {
      border: 2px solid rgba(255,46,151,0.6); color: var(--active);
      box-shadow: 0 0 12px rgba(255,46,151,.28);
    }
    .jatski-cluster.all-inactive {
      border: 2px solid rgba(30,90,180,0.45); color: #5a9fd4;
      box-shadow: 0 0 8px rgba(30,90,180,.18);
    }
    .jatski-cluster-sm { width: 30px; height: 30px; font-size: 11px; }
    .jatski-cluster-md { width: 40px; height: 40px; font-size: 13px; }
    .jatski-cluster-lg {
      width: 50px; height: 50px; font-size: 15px;
    }
    .jatski-cluster-lg.has-active {
      border-color: rgba(0,229,255,0.6); color: var(--cyan);
      box-shadow: 0 0 16px rgba(0,229,255,.28);
    }

    /* ── Mobile ── */
    /* ── Route list ── */
    .route-list {
      margin-top: 6px;
      max-height: 160px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 2px;
    }
    .route-list:empty { display: none; }
    .route-list-item {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; text-align: left;
      padding: 5px 8px; border-radius: 6px;
      background: rgba(255,46,151,0.06);
      border: 1px solid rgba(255,46,151,0.12);
      cursor: pointer; font-family: var(--font);
      transition: background .15s, border-color .15s;
    }
    .route-list-item:hover {
      background: rgba(255,46,151,0.18);
      border-color: rgba(255,46,151,0.38);
    }
    .rli-id  { font-size: 11px; font-weight: 700; color: var(--text); letter-spacing: 0.3px; }
    .rli-zip { font-size: 10px; color: var(--muted); margin-left: 6px; }

    @media (max-width: 480px) {
      .ctrl-title    { min-width: 0; padding: 8px 10px; gap: 8px; }
      .ctrl-search   { min-width: 0; padding: 7px 9px; }
      .ctrl-datepanel { min-width: 0; padding: 9px 10px; }
      .title-text    { font-size: 12px; letter-spacing: 1px; }
      .btn-lang      { font-size: 9px; padding: 4px 8px; }
      .search-input  { font-size: 12px; padding: 5px 8px; }
      .search-btn    { width: 36px; height: 36px; }
      .search-results { max-height: 40vh; overflow-y: auto; }
      .ctrl-datepanel .panel-title { font-size: 8px; }
      .ctrl-datepanel input[type="date"] { font-size: 12px; padding: 6px 8px; }
      .route-list { max-height: 120px; }
      /* Ensure all tappable buttons meet 44px touch target */
      .btn-live, .btn-geo { min-height: 44px; }
      .leaflet-control-zoom { display: none; }
    }
  </style>
</head>
<body>
<div id="loading-overlay">
  <div class="lo-title">🍦 JÄTSKIAUTO</div>
  <div class="lo-sub">HELSINKI METRO</div>
  <div class="lo-bar"><div class="lo-bar-inner"></div></div>
</div>
<div id="map"></div>
<script>
// ── Constants ────────────────────────────────────────────────────────────────

const ACTIVE_COLOR   = '#ff2e97';
const INACTIVE_COLOR = '#1e5ab4';

const DWELL_MIN  = 3;
const APPEAR_MIN = 5;
const VANISH_MIN = 5;
const GAP_MIN    = 30;  // minutes — gaps wider than this break the route line and hide truck

// ── Language strings ──────────────────────────────────────────────────────────

let lang = 'fi';
const T = {
  fi: {
    panelTitle:    'Näytä reitit päivälle',
    liveBtn:       'Takaisin tänään',
    routesActive:  n => `<strong>${n}</strong> reitti${n !== 1 ? 'ä' : ''} ajossa`,
    noRoutes:      'Ei reittejä tälle päivälle',
    today:         'Tänään',
    upcoming:      'Seuraavat käynnit',
    copyLink:      '🔗 Kopioi linkki',
    noGeo:         'Sijainnin käyttö ei onnistu tässä selaimessa.',
    geoFailed:     code => code === 1 ? 'Sijainnin käyttöoikeus evätty. Salli sijainti selaimen asetuksista.' : code === 2 ? 'Sijaintia ei saatu. Laite ei löytänyt sijaintiasi.' : 'Sijainnin haku aikakatkaistiin.',
    noActiveToday: 'Ei aktiivisia reittejä valitulle päivälle.',
    yourLocation:  'Sijaintisi',
    walkLabel:     (min, name, time) => `🚶 ${min} min kävelyä\n${name} klo ${time}`,
    searchPH:      'Hae osoite...',
    searchNone:    'Ei tuloksia',
    stops:         n => `${n} pys.`,
    langLabel:     () => '<span class="al">FI</span> | EN',
  },
  en: {
    panelTitle:    'Show routes for',
    liveBtn:       'Back to today',
    routesActive:  n => `<strong>${n}</strong> route${n !== 1 ? 's' : ''} active`,
    noRoutes:      'No routes for this day',
    today:         'Today',
    upcoming:      'Upcoming visits',
    copyLink:      '🔗 Copy link',
    noGeo:         'Geolocation is not available in this browser.',
    geoFailed:     code => code === 1 ? 'Location permission denied. Allow location in browser settings.' : code === 2 ? 'Location unavailable. Your device could not determine position.' : 'Location request timed out.',
    noActiveToday: 'No active routes for the selected day.',
    yourLocation:  'Your location',
    walkLabel:     (min, name, time) => `🚶 ${min} min walk\n${name} at ${time}`,
    searchPH:      'Search address...',
    searchNone:    'No results found',
    stops:         n => `${n} stops`,
    langLabel:     () => 'FI | <span class="al">EN</span>',
  },
};

// ── Map init ─────────────────────────────────────────────────────────────────

const map = L.map('map', { zoomControl: true }).setView([60.25, 24.90], 11);
map.createPane('tiles');
map.getPane('tiles').style.zIndex = 200;  // below overlayPane (400) so polylines render on top
map.getPane('tiles').style.filter = 'brightness(0.58) saturate(0.55) hue-rotate(255deg) sepia(0.08)';
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19, pane: 'tiles',
}).addTo(map);

// ── Helpers ───────────────────────────────────────────────────────────────────

function isoToday() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function toMin(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
}
function nowMin() {
  const n = new Date();
  return n.getHours() * 60 + n.getMinutes() + n.getSeconds() / 60;
}
function toHHMM(m) {
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(Math.round(m) % 60).padStart(2, '0');
}
function formatDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString(lang === 'fi' ? 'fi-FI' : 'en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
}
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371, toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function upcomingFrom(schedules, fromISO, n = 4) {
  return schedules
    .filter(s => s.date >= fromISO)
    .sort((a, b) => a.date.localeCompare(b.date))
    .slice(0, n);
}
function stopTimeState(stop, iso, t) {
  const sc = (stop.schedules || []).find(s => s.date === iso);
  if (!sc) return '';
  const arrMin = toMin(sc.time);
  if (t >= arrMin && t <= arrMin + DWELL_MIN) return 'now';
  if (t > arrMin + DWELL_MIN) return 'past';
  if (t >= arrMin - 30) return 'soon';
  return '';
}

// ── Popup ────────────────────────────────────────────────────────────────────

function stopPopup(stop, selectedISO) {
  const schedules = stop.schedules || [];
  const todayISO  = isoToday();
  const selSched  = schedules.find(s => s.date === selectedISO);
  const isToday   = selectedISO === todayISO;
  const upcoming  = upcomingFrom(schedules.filter(s => s.date !== selectedISO), selectedISO);
  const hashVal   = `stop=${encodeURIComponent(stop.name)}&zip=${stop.zip}`;

  let html = `<div class="popup-stop">
    <div class="popup-header">
      <div class="stop-name">${stop.name}</div>
      <div class="stop-zip">${stop.zip}</div>
    </div>
    <div class="popup-body">`;

  if (selSched) {
    const isPast = isToday && nowMin() > toMin(selSched.time) + DWELL_MIN;
    const cls   = isToday ? (isPast ? 'today-past' : 'today') : 'other-day';
    const label = isToday ? T[lang].today : formatDate(selectedISO);
    html += `<div class="popup-time-box ${cls}">
      <div><div class="tbox-label">${label}</div><div class="tbox-time">${selSched.time}</div></div>
    </div>`;
  }
  if (upcoming.length) {
    html += `<div class="popup-upcoming"><div class="upcoming-title">${T[lang].upcoming}</div>`;
    upcoming.forEach(s => {
      html += `<div class="upcoming-row"><span>${formatDate(s.date)}</span><span>${s.time}</span></div>`;
    });
    html += `</div>`;
  }
  if (stop.phone) html += `<div class="popup-phone">📞 ${stop.phone}</div>`;
  html += `<button class="popup-copy-btn" onclick="copyStopLink('${hashVal}')">${T[lang].copyLink}</button>`;
  html += `</div></div>`;
  return html;
}

function copyStopLink(hashVal) {
  const url = location.href.split('#')[0] + '#' + hashVal;
  navigator.clipboard.writeText(url).catch(() => {
    const inp = document.createElement('input');
    inp.value = url; document.body.appendChild(inp); inp.select();
    document.execCommand('copy'); document.body.removeChild(inp);
  });
}

// ── Routed geometry ───────────────────────────────────────────────────────────

function buildRoutedLatlngs(stops) {
  const hasRouting = stops.some(s => Array.isArray(s.path_to_next) && s.path_to_next.length > 0);
  if (!hasRouting) return stops.map(s => [s.lat, s.lon]);
  const pts = [[stops[0].lat, stops[0].lon]];
  for (let i = 0; i < stops.length - 1; i++) {
    const leg = stops[i].path_to_next;
    if (Array.isArray(leg) && leg.length > 0) {
      leg.slice(1).forEach(p => pts.push(p));
    } else {
      pts.push([stops[i+1].lat, stops[i+1].lon]);
    }
  }
  return pts;
}

// ── Truck position ────────────────────────────────────────────────────────────

function getTruckPosition(stops, stopTimesMin, t) {
  if (!stopTimesMin.length) return null;
  const first = stopTimesMin[0], last = stopTimesMin[stopTimesMin.length-1];
  if (t < first - APPEAR_MIN || t > last + VANISH_MIN) return null;
  if (t < first) return { lat: stops[0].lat, lon: stops[0].lon };
  for (let i = 0; i < stopTimesMin.length; i++) {
    const arrive = stopTimesMin[i], depart = arrive + DWELL_MIN;
    if (t >= arrive && t <= depart) return { lat: stops[i].lat, lon: stops[i].lon };
    if (i + 1 < stopTimesMin.length) {
      const next = stopTimesMin[i+1];
      if (t > depart && t < next) {
        if (next - depart > GAP_MIN) {
          // Large gap: hide during travel, reappear near next stop
          return t >= next - APPEAR_MIN ? { lat: stops[i+1].lat, lon: stops[i+1].lon } : null;
        }
        const p = (t - depart) / (next - depart);
        return {
          lat: stops[i].lat + p * (stops[i+1].lat - stops[i].lat),
          lon: stops[i].lon + p * (stops[i+1].lon - stops[i].lon),
        };
      }
    }
  }
  return { lat: stops[stops.length-1].lat, lon: stops[stops.length-1].lon };
}

function findClosestIndex(latlngs, stop) {
  let best = 0, bestD = Infinity;
  latlngs.forEach((ll, i) => {
    const lat = ll.lat ?? ll[0], lng = ll.lng ?? ll[1];
    const d = (lat - stop.lat) ** 2 + (lng - stop.lon) ** 2;
    if (d < bestD) { bestD = d; best = i; }
  });
  return best;
}

// Build gapped multi-segment latlngs: breaks line where consecutive stops differ > GAP_MIN
function buildGappedLatlngs(stops, perStopTimes) {
  const segments = [];
  let seg = [[stops[0].lat, stops[0].lon]];
  for (let i = 0; i < stops.length - 1; i++) {
    const t1 = perStopTimes[i], t2 = perStopTimes[i + 1];
    if (t1 != null && t2 != null && (t2 - t1) > GAP_MIN) {
      if (seg.length >= 2) segments.push(seg);
      seg = [[stops[i + 1].lat, stops[i + 1].lon]];
    } else {
      seg.push([stops[i + 1].lat, stops[i + 1].lon]);
    }
  }
  if (seg.length >= 2) segments.push(seg);
  return segments.length ? segments : [stops.map(s => [s.lat, s.lon])];
}

function applyGeometry(geom, iso) {
  if (!geom) return;
  const activeIdx = dateIndex.get(iso) || new Set();
  routeLayers.forEach(({ polyline, route }, idx) => {
    if (!activeIdx.has(idx)) return;
    const path = geom[route.route_id];
    if (!Array.isArray(path) || path.length < 2) return;
    const stops = route.stops;
    const perStopTimes = stops.map(s => {
      const sc = (s.schedules || []).find(sc => sc.date === iso);
      return sc ? toMin(sc.time) : null;
    });

    // Identify gap positions (index i means gap between stop i-1 and stop i)
    const gapBefore = stops.map((_, i) => {
      if (i === 0) return false;
      const t1 = perStopTimes[i - 1], t2 = perStopTimes[i];
      return t1 != null && t2 != null && (t2 - t1) > GAP_MIN;
    });
    const hasGap = gapBefore.some(Boolean);

    if (!hasGap) {
      // No gaps — apply the full OSRM path directly
      polyline.setLatLngs(path);
      polyline.redraw();
      if (iso === isoToday()) {
        const rm = activeRouteMeta.find(r => r.route.route_id === route.route_id);
        if (rm) rm.fullCoords = path;
      }
      return;
    }

    // Has gaps — split the OSRM path at each gap boundary into separate segments
    const stopSegments = [];
    let seg = [stops[0]];
    for (let i = 1; i < stops.length; i++) {
      if (gapBefore[i]) { stopSegments.push(seg); seg = [stops[i]]; }
      else seg.push(stops[i]);
    }
    stopSegments.push(seg);

    const segments = [];
    for (const stopSeg of stopSegments) {
      if (stopSeg.length < 2) continue;
      const startIdx = findClosestIndex(path, stopSeg[0]);
      const endIdx   = findClosestIndex(path, stopSeg[stopSeg.length - 1]);
      if (endIdx > startIdx) segments.push(path.slice(startIdx, endIdx + 1));
    }

    if (segments.length) { polyline.setLatLngs(segments); polyline.redraw(); }
  });
}

// ── Icon makers ───────────────────────────────────────────────────────────────

function makeStopIcon(active, timeState) {
  let cls = 'stop-dot';
  if (!active) cls += ' inactive';
  else if (timeState) cls += ' ' + timeState;
  return L.divIcon({ html: `<div class="${cls}"></div>`, className: '', iconSize: [12,12], iconAnchor: [6,6] });
}
function makeTruckIcon() {
  return L.divIcon({ html: '<div class="truck-marker">🍦</div>', className: '', iconSize: [38,38], iconAnchor: [19,19] });
}

// ── State ────────────────────────────────────────────────────────────────────

let allRoutes    = [];
let routeLayers  = [];
let truckMarkers = {};
let truckTrails  = {};
let truckTrailBuf= {};
let selectedISO  = isoToday();
let animTimer    = null;
let clusterGroup;
let dateIndex = new Map();       // date → Set<routeLayerIndex>, populated on data load
let activeRouteMeta = [];        // live-mode per-route state (fullCoords, timesMin, etc.)
let cachedGeom = null;           // OSRM geometry cache, keyed by route_id
let revealTimers = [];

// DOM refs (set after controls are created)
let routeCountEl, routeListEl, liveBtn, dateInput, langBtn, searchInputEl, searchResultsEl, panelTitleEl;

// ── Cluster factory ───────────────────────────────────────────────────────────

function makeCluster() {
  return L.markerClusterGroup({
    maxClusterRadius: 40,
    disableClusteringAtZoom: 14,
    spiderfyOnMaxZoom: true,
    iconCreateFunction(cluster) {
      const children = cluster.getAllChildMarkers();
      const hasActive = children.some(m => m._active === true);
      const n   = cluster.getChildCount();
      const act = hasActive ? 'has-active' : 'all-inactive';
      let sz = 'sm', w = 30;
      if (n >= 50) { sz = 'lg'; w = 50; }
      else if (n >= 15) { sz = 'md'; w = 40; }
      return L.divIcon({
        html: `<div class="jatski-cluster jatski-cluster-${sz} ${act}">${n}</div>`,
        className: '', iconSize: [w,w], iconAnchor: [w/2,w/2],
      });
    },
  });
}

// ── Reveal helpers ────────────────────────────────────────────────────────────

function clearRevealTimers() {
  revealTimers.forEach(id => clearTimeout(id));
  revealTimers = [];
}

// ── renderDate ────────────────────────────────────────────────────────────────

function renderDate(iso) {
  selectedISO = iso;
  const todayISO = isoToday();
  const isLive   = iso === todayISO;
  const t        = isLive ? nowMin() : -1;

  clearRevealTimers();

  // O(1) lookup via pre-built index instead of O(routes×stops) scan
  const activeIdx = dateIndex.get(iso) || new Set();
  const active    = routeLayers.filter((_, i) => activeIdx.has(i));
  const inactive  = routeLayers.filter((_, i) => !activeIdx.has(i));

  // Instantly dim inactive (no setPopupContent — popups are built lazily on click)
  inactive.forEach(({ polyline, passedPolyline, markers }) => {
    polyline.setStyle({ color: INACTIVE_COLOR, weight: 1.5, opacity: 0 });
    if (passedPolyline) passedPolyline.setLatLngs([]);
    markers.forEach(m => { m._active = false; m.setIcon(makeStopIcon(false, '')); });
  });

  // Stagger-reveal active
  active.forEach(({ polyline, route: rl, markers }, i) => {
    const perStopTimes = rl.stops.map(s => {
      const sc = (s.schedules || []).find(sc => sc.date === iso);
      return sc ? toMin(sc.time) : null;
    });
    polyline.setLatLngs(buildGappedLatlngs(rl.stops, perStopTimes));
    polyline.setStyle({ color: ACTIVE_COLOR, weight: 3, opacity: 0 });
    const tid = setTimeout(() => {
      polyline.setStyle({ opacity: 0.7 });
      markers.forEach(m => {
        const ts = isLive ? stopTimeState(m._stop, iso, t) : '';
        m._active = true;
        m.setIcon(makeStopIcon(true, ts));
      });
    }, Math.min(i, 60) * 40);
    revealTimers.push(tid);
  });

  // Apply cached OSRM road geometry if available (overwrites straight lines)
  if (cachedGeom) applyGeometry(cachedGeom, iso);

  // Refresh cluster icons after animations settle
  const refreshId = setTimeout(
    () => clusterGroup && clusterGroup.refreshClusters(),
    Math.min(active.length, 60) * 40 + 80
  );
  revealTimers.push(refreshId);

  // Route count
  if (routeCountEl) {
    routeCountEl.innerHTML = active.length > 0
      ? T[lang].routesActive(active.length)
      : `<span style="color:rgba(245,238,255,.35)">${T[lang].noRoutes}</span>`;
  }

  // Route list
  if (routeListEl) {
    routeListEl.innerHTML = '';
    active.forEach(({ polyline, route }) => {
      const label = route.route_id || route.route_name;
      const zip   = (route.zips && route.zips[0]) || (route.stops && route.stops[0] && route.stops[0].zip) || '';
      const item  = document.createElement('button');
      item.className = 'route-list-item';
      item.innerHTML = `<span class="rli-id">${label}</span>${zip ? `<span class="rli-zip">${zip}</span>` : ''}`;
      item.addEventListener('click', () => {
        try { map.fitBounds(polyline.getBounds(), { padding: [50, 50], animate: true, duration: 0.8 }); } catch(e) {}
      });
      routeListEl.appendChild(item);
    });
  }

  // Live button
  if (liveBtn) liveBtn.classList.toggle('is-today', isLive);

  // Trucks: clear and restart only for today
  if (animTimer) { clearInterval(animTimer); animTimer = null; }
  Object.values(truckMarkers).forEach(m => { if (map.hasLayer(m)) map.removeLayer(m); });
  Object.values(truckTrails).forEach(segs => segs.forEach(pl => { if (map.hasLayer(pl)) map.removeLayer(pl); }));
  truckMarkers = {}; truckTrails = {}; truckTrailBuf = {};
  // Reset any passed-segment polylines from a previous live session
  if (!isLive) routeLayers.forEach(({ passedPolyline }) => { if (passedPolyline) passedPolyline.setLatLngs([]); });

  if (isLive) {
    activeRouteMeta = active.map(({ polyline, passedPolyline, route }) => {
      const stops = route.stops;
      const timesMin = stops.map(s => {
        const sc = (s.schedules || []).find(sc => sc.date === todayISO);
        return sc ? toMin(sc.time) : null;
      }).filter(v => v !== null);
      const hasGap = timesMin.some((t, i) => i > 0 && (t - timesMin[i - 1]) > GAP_MIN);
      const fullCoords = polyline.getLatLngs().map(ll => [ll.lat ?? ll[0], ll.lng ?? ll[1]]);
      return { polyline, passedPolyline, route, stops, timesMin, fullCoords, hasGap };
    });

    function updateTrucks() {
      const now = nowMin();
      activeRouteMeta.forEach(rm => {
      const { polyline, passedPolyline, route, stops, timesMin } = rm;
        const pos = getTruckPosition(stops, timesMin, now);
        const rid = route.route_id;
        if (pos) {
          if (!truckMarkers[rid]) {
            truckMarkers[rid] = L.marker([pos.lat, pos.lon], {
              icon: makeTruckIcon(), zIndexOffset: 1000,
            }).addTo(map);
            truckMarkers[rid].on('click', () => {
              const t = nowMin();
              let statusHtml = '';
              for (let i = 0; i < timesMin.length; i++) {
                const arrive = timesMin[i], depart = arrive + DWELL_MIN;
                if (t >= arrive && t <= depart) {
                  statusHtml = `<div class="truck-status">${stops[i].name}<br><span>klo ${toHHMM(timesMin[i])}</span></div>`;
                  break;
                }
                if (i + 1 < timesMin.length && t > depart && t < timesMin[i + 1]) {
                  statusHtml = `<div class="truck-status">▶ ${stops[i + 1].name}<br><span>klo ${toHHMM(timesMin[i + 1])}</span></div>`;
                  break;
                }
              }
              const upcoming = timesMin
                .map((m, i) => ({ m, s: stops[i] }))
                .filter(({ m }) => m > t + DWELL_MIN)
                .slice(0, 3);
              const upHtml = upcoming.length
                ? `<div class="truck-upcoming">${upcoming.map(({ m, s }) => `<div><span>${s.name}</span><span>${toHHMM(m)}</span></div>`).join('')}</div>`
                : '';
              L.popup({ maxWidth: Math.min(240, window.innerWidth - 32) })
                .setLatLng(truckMarkers[rid].getLatLng())
                .setContent(`<div class="popup-truck"><strong>🍦 ${route.route_id}</strong>${statusHtml}${upHtml}</div>`)
                .openOn(map);
            });
          } else {
            truckMarkers[rid].setLatLng([pos.lat, pos.lon]);
            if (!map.hasLayer(truckMarkers[rid])) truckMarkers[rid].addTo(map);
          }
          // Trail
          if (!truckTrailBuf[rid]) truckTrailBuf[rid] = [];
          truckTrailBuf[rid].push([pos.lat, pos.lon]);
          if (truckTrailBuf[rid].length > 6) truckTrailBuf[rid].shift();
          if (truckTrails[rid]) truckTrails[rid].forEach(pl => { if (map.hasLayer(pl)) map.removeLayer(pl); });
          truckTrails[rid] = [];
          const buf = truckTrailBuf[rid];
          const ops = [0.65, 0.45, 0.28, 0.14, 0.06];
          for (let j = 0; j < buf.length - 1; j++) {
            truckTrails[rid].push(L.polyline([buf[j], buf[j+1]], {
              color: ACTIVE_COLOR, weight: 3,
              opacity: ops[Math.max(0, ops.length - (buf.length-1) + j)],
              interactive: false,
            }).addTo(map));
          }
          // Split route into passed (faded) / upcoming (full) at last departed stop
          if (passedPolyline && !rm.hasGap && rm.fullCoords.length > 1) {
            let passedStopIdx = -1;
            for (let i = 0; i < timesMin.length; i++) {
              if (now > timesMin[i] + DWELL_MIN) passedStopIdx = i; else break;
            }
            if (passedStopIdx >= 0) {
              const all = rm.fullCoords;
              const splitIdx = findClosestIndex(all, stops[passedStopIdx]);
              polyline.setLatLngs(all.slice(splitIdx));
              passedPolyline.setLatLngs(all.slice(0, splitIdx + 1));
              passedPolyline.setStyle({ opacity: 0.22, weight: 2 });
              polyline.redraw(); passedPolyline.redraw();
            } else {
              polyline.setLatLngs(rm.fullCoords);
              passedPolyline.setLatLngs([]);
              polyline.redraw();
            }
          }
        } else if (truckMarkers[rid] && map.hasLayer(truckMarkers[rid])) {
          map.removeLayer(truckMarkers[rid]);
          if (truckTrails[rid]) { truckTrails[rid].forEach(pl => { if (map.hasLayer(pl)) map.removeLayer(pl); }); }
          delete truckMarkers[rid]; delete truckTrails[rid]; delete truckTrailBuf[rid];
        }
      });
      // Update stop glow states
      const t2 = nowMin();
      active.forEach(({ markers }) => {
        markers.forEach(m => { m.setIcon(makeStopIcon(true, stopTimeState(m._stop, todayISO, t2))); });
      });
    }
    updateTrucks();
    setTimeout(updateTrucks, 5_000);          // defensive retry in case first call was mid-gap
    animTimer = setInterval(updateTrucks, 30_000);
  }
}

// ── Polyline hover ────────────────────────────────────────────────────────────

function attachHover(polyline, route) {
  polyline.on('mouseover', () => {
    const isActive = route.stops.some(s => (s.schedules || []).some(sc => sc.date === selectedISO));
    if (!isActive) return;
    polyline.setStyle({ weight: 7, opacity: 1.0 });
    polyline.bringToFront();
    const day = route.weekday ? route.weekday.charAt(0).toUpperCase() + route.weekday.slice(1) : '?';
    polyline.bindTooltip(`<strong>${route.route_id}</strong><br>${day} · ${T[lang].stops(route.stops.length)}`,
      { sticky: true, direction: 'top' }).openTooltip();
  });
  polyline.on('mouseout', () => {
    const isActive = route.stops.some(s => (s.schedules || []).some(sc => sc.date === selectedISO));
    polyline.setStyle({ weight: isActive ? 3 : 1.5, opacity: isActive ? 0.7 : 0 });
    polyline.closeTooltip();
  });
}

// ── Geolocation ───────────────────────────────────────────────────────────────

function findNearestStop(userLat, userLon) {
  let best = null, bestDist = Infinity, bestMarker = null;
  routeLayers.forEach(({ markers, route }) => {
    const active = route.stops.some(s => (s.schedules || []).some(sc => sc.date === selectedISO));
    if (!active) return;
    markers.forEach(m => {
      const ll = m.getLatLng();
      const d  = haversineKm(userLat, userLon, ll.lat, ll.lng);
      if (d < bestDist) { bestDist = d; best = m._stop; bestMarker = m; }
    });
  });
  return { stop: best, marker: bestMarker, distKm: bestDist };
}

// ── URL hash ──────────────────────────────────────────────────────────────────

function parseHash() {
  const h = location.hash.slice(1); if (!h) return null;
  const p = new URLSearchParams(h);
  return { name: p.get('stop'), zip: p.get('zip') };
}
function openStopFromHash() {
  const h = parseHash(); if (!h || !h.name) return;
  for (const { markers } of routeLayers) {
    for (const m of markers) {
      if (m._stop.name === h.name && (!h.zip || m._stop.zip === h.zip)) {
        clusterGroup.zoomToShowLayer(m, () => { m.openPopup(); map.panTo(m.getLatLng()); });
        return;
      }
    }
  }
}

// ── Language switch ───────────────────────────────────────────────────────────

function switchLang() {
  lang = lang === 'fi' ? 'en' : 'fi';
  if (langBtn)       langBtn.innerHTML        = T[lang].langLabel();
  if (panelTitleEl)  panelTitleEl.textContent = T[lang].panelTitle;
  if (searchInputEl) searchInputEl.placeholder= T[lang].searchPH;
  if (liveBtn)       liveBtn.innerHTML        = `<span class="pulse-dot"></span> ${T[lang].liveBtn}`;
  renderDate(selectedISO);
}

// ── Address search (Nominatim) ────────────────────────────────────────────────

let searchPin = null;
async function doSearch(query) {
  if (!query.trim() || !searchResultsEl) return;
  searchResultsEl.innerHTML = '';
  try {
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=fi&q=${encodeURIComponent(query)}`;
    const results = await (await fetch(url, { headers: { 'Accept-Language': lang === 'fi' ? 'fi' : 'en' } })).json();
    if (!results.length) {
      searchResultsEl.innerHTML = `<div class="search-result-item" style="color:var(--muted)">${T[lang].searchNone}</div>`;
      return;
    }
    results.forEach(r => {
      const item = document.createElement('div');
      item.className = 'search-result-item';
      const parts = r.display_name.split(', ');
      item.innerHTML = `<div class="search-result-name">${parts[0]}</div><div class="search-result-sub">${parts.slice(1,3).join(', ')}</div>`;
      item.addEventListener('click', () => {
        if (searchPin && map.hasLayer(searchPin)) map.removeLayer(searchPin);
        const latlng = [parseFloat(r.lat), parseFloat(r.lon)];
        map.flyTo(latlng, 15, { duration: 1.2 });
        searchPin = L.circleMarker(latlng, {
          radius: 8, color: '#00e5ff', fillColor: '#00e5ff',
          fillOpacity: 0.55, weight: 2.5, interactive: false,
        }).addTo(map).bindPopup(`<span style="font-family:Nunito,sans-serif;font-size:12px;color:#f5eeff">${parts[0]}</span>`).openPopup();
        searchResultsEl.innerHTML = '';
        if (searchInputEl) searchInputEl.value = '';
      });
      searchResultsEl.appendChild(item);
    });
  } catch(e) { console.error('Nominatim error', e); }
}
map.on('click', () => { if (searchResultsEl) searchResultsEl.innerHTML = ''; });

// ── Main ─────────────────────────────────────────────────────────────────────

const dataPromise = (typeof window.ROUTE_DATA !== 'undefined')
  ? Promise.resolve(window.ROUTE_DATA)
  : fetch('./metro_ice_cream_routes.json?v=' + Date.now()).then(r => r.json());
const metaPromise = fetch('./meta.json?v=' + Date.now()).then(r => r.json()).catch(() => null);

Promise.all([dataPromise, metaPromise]).then(([data, meta]) => {
  allRoutes = Array.isArray(data) ? data : Object.values(data);


  // ── Title + language toggle (top-left) ────────────────────────────────────
  new (L.Control.extend({
    onAdd() {
      const d = document.createElement('div');
      d.className = 'ctrl-title glass';
      const metaLine = meta?.generated
        ? `<div class="meta-updated">Data: ${meta.generated} · ${meta.routes} reittiä · ${meta.stops} pys.</div>`
        : '';
      d.innerHTML = `
        <div class="title-left">
          <div class="title-text">🍦 <span class="ice">JÄTSKI</span><span class="cyan">AUTO</span></div>
          ${metaLine}
          <a class="gh-link" href="https://github.com/davwunder/jatskiauto" target="_blank" rel="noopener">⌥ vibe coding exercise · github</a>
        </div>
        <button class="btn-lang" id="btn-lang">${T[lang].langLabel()}</button>`;
      L.DomEvent.disableClickPropagation(d);
      L.DomEvent.disableScrollPropagation(d);
      return d;
    }
  }))({ position: 'topleft' }).addTo(map);
  langBtn = document.getElementById('btn-lang');
  langBtn.addEventListener('click', switchLang);

  // ── Address search (top-left, below title) ────────────────────────────────
  new (L.Control.extend({
    onAdd() {
      const wrap = document.createElement('div');
      wrap.className = 'ctrl-search glass';
      wrap.innerHTML = `
        <div class="search-row">
          <input class="search-input" id="search-input" type="text"
            placeholder="${T[lang].searchPH}" autocomplete="off" />
          <button class="search-btn" id="search-btn">🔍</button>
        </div>
        <div class="search-results" id="search-results"></div>`;
      L.DomEvent.disableClickPropagation(wrap);
      L.DomEvent.disableScrollPropagation(wrap);
      return wrap;
    }
  }))({ position: 'topleft' }).addTo(map);
  searchInputEl   = document.getElementById('search-input');
  searchResultsEl = document.getElementById('search-results');
  searchInputEl.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(searchInputEl.value); });
  document.getElementById('search-btn').addEventListener('click', () => doSearch(searchInputEl.value));

  // ── Date panel (top-right) ────────────────────────────────────────────────
  new (L.Control.extend({
    onAdd() {
      const wrap = document.createElement('div');
      wrap.className = 'ctrl-datepanel glass';

      panelTitleEl = document.createElement('div');
      panelTitleEl.className = 'panel-title';
      panelTitleEl.textContent = T[lang].panelTitle;
      wrap.appendChild(panelTitleEl);

      dateInput = document.createElement('input');
      dateInput.type = 'date'; dateInput.value = isoToday();
      // Range auto-detected from data (set after routeLayers built, patched below)
      dateInput.addEventListener('change', () => { if (dateInput.value) renderDate(dateInput.value); });
      wrap.appendChild(dateInput);

      routeCountEl = document.createElement('div');
      routeCountEl.className = 'route-count';
      wrap.appendChild(routeCountEl);

      routeListEl = document.createElement('div');
      routeListEl.className = 'route-list';
      wrap.appendChild(routeListEl);

      L.DomEvent.disableClickPropagation(wrap);
      L.DomEvent.disableScrollPropagation(wrap);
      return wrap;
    }
  }))({ position: 'topright' }).addTo(map);

  // ── Live button (bottom-right) ────────────────────────────────────────────
  new (L.Control.extend({
    onAdd() {
      liveBtn = document.createElement('button');
      liveBtn.className = 'btn-live glass is-today';
      liveBtn.innerHTML = `<span class="pulse-dot"></span> ${T[lang].liveBtn}`;
      liveBtn.addEventListener('click', () => {
        const t = isoToday(); dateInput.value = t; renderDate(t);
      });
      L.DomEvent.disableClickPropagation(liveBtn);
      L.DomEvent.disableScrollPropagation(liveBtn);
      return liveBtn;
    }
  }))({ position: 'bottomright' }).addTo(map);

  // ── Geolocation button (bottom-left) ─────────────────────────────────────
  new (L.Control.extend({
    onAdd() {
      const btn = document.createElement('button');
      btn.className = 'btn-geo glass';
      btn.title = lang === 'fi' ? 'Lähin jätskiauto' : 'Nearest ice cream truck';
      btn.textContent = '📍';
      btn.addEventListener('click', () => {
        if (!navigator.geolocation) { alert(T[lang].noGeo); return; }
        btn.textContent = '⏳';
        navigator.geolocation.getCurrentPosition(
          pos => {
            btn.textContent = '📍';
            const { latitude: lat, longitude: lon } = pos.coords;

            // Show user dot
            L.circleMarker([lat, lon], {
              radius: 8, color: '#00e5ff', fillColor: '#00e5ff',
              fillOpacity: 0.5, weight: 2, interactive: false,
            }).addTo(map).bindTooltip(T[lang].yourLocation, { direction: 'top' }).openTooltip();

            const { stop, marker, distKm } = findNearestStop(lat, lon);
            if (!stop) { alert(T[lang].noActiveToday); return; }

            const walkMin = Math.round(distKm / 5 * 60);
            const sc = (stop.schedules || []).find(s => s.date === selectedISO);

            clusterGroup.zoomToShowLayer(marker, () => {
              map.setView(marker.getLatLng(), 15, { animate: true, duration: 1.0 });
              setTimeout(() => marker.openPopup(), 500);
            });

            if (sc) {
              setTimeout(() => {
                L.popup({ closeButton: true, autoPan: false })
                  .setLatLng([lat, lon])
                  .setContent(`<span style="font-family:Nunito,sans-serif;font-size:12px;color:#f5eeff">🚶 ${walkMin} min<br><strong>${stop.name}</strong><br>${lang === 'fi' ? 'klo' : 'at'} ${sc.time}</span>`)
                  .openOn(map);
              }, 700);
            }
          },
          err => { btn.textContent = '📍'; alert(T[lang].geoFailed(err.code)); },
          { timeout: 15000, enableHighAccuracy: true }
        );
      });
      L.DomEvent.disableClickPropagation(btn);
      L.DomEvent.disableScrollPropagation(btn);
      return btn;
    }
  }))({ position: 'bottomleft' }).addTo(map);

  // ── Cluster group ─────────────────────────────────────────────────────────
  clusterGroup = makeCluster();
  clusterGroup.addTo(map);

  // ── Build route layers ────────────────────────────────────────────────────
  // ── Build route layers + collect all markers for batch add ──────────────
  const allMarkers = [];

  allRoutes.forEach((route, routeIdx) => {
    const stops = route.stops;
    if (!stops.length) return;

    const polyline = L.polyline(buildRoutedLatlngs(stops), {
      color: INACTIVE_COLOR, weight: 1.5, opacity: 0,
    }).addTo(map);
    attachHover(polyline, route);

    const markers = stops.map(stop => {
      const m = L.marker([stop.lat, stop.lon], { icon: makeStopIcon(false, ''), zIndexOffset: 100 });
      m._stop   = stop;
      m._active = false;
      // Lazy popup — built only when actually opened (not pre-built for all 6k+ stops)
      m.bindPopup(() => stopPopup(m._stop, selectedISO), { maxWidth: Math.min(260, window.innerWidth - 32) });
      m.on('popupopen',  () => history.replaceState(null, '', '#stop=' + encodeURIComponent(stop.name) + '&zip=' + stop.zip));
      m.on('popupclose', () => history.replaceState(null, '', location.pathname + location.search));
      allMarkers.push(m);
      return m;
    });

    // Fill date index
    stops.forEach(stop => {
      (stop.schedules || []).forEach(sc => {
        if (!dateIndex.has(sc.date)) dateIndex.set(sc.date, new Set());
        dateIndex.get(sc.date).add(routeIdx);
      });
    });

    const passedPolyline = L.polyline([], {
      color: ACTIVE_COLOR, weight: 2, opacity: 0, interactive: false,
    }).addTo(map);
    routeLayers.push({ polyline, passedPolyline, markers, route });
  });

  // Batch-add all markers at once (much faster than 6k individual addLayer calls)
  clusterGroup.addLayers(allMarkers);

  // Auto-detect season date range from data
  if (dateIndex.size > 0) {
    const dates = [...dateIndex.keys()].sort();
    if (dateInput) { dateInput.min = dates[0]; dateInput.max = dates[dates.length - 1]; }
  }

  // Dismiss loading overlay
  const overlay = document.getElementById('loading-overlay');
  if (overlay) { overlay.classList.add('fade-out'); setTimeout(() => overlay.remove(), 600); }

  // Initial render + hash restore
  renderDate(isoToday());
  setTimeout(openStopFromHash, 500);

  // ── Lazy-load OSRM geometry in the background (non-blocking) ────────────────
  fetch('./metro_routes_geometry.json')
    .then(r => { if (!r.ok) throw new Error('no geometry file'); return r.json(); })
    .then(geom => {
      cachedGeom = geom;
      applyGeometry(geom, selectedISO);
    })
    .catch(() => { /* geometry file absent or failed — keep straight lines */ });

}).catch(err => {
  console.error(err);
  document.body.innerHTML = `
    <div style="padding:3em;font-family:Nunito,sans-serif;text-align:center;color:#f5eeff;background:#0d0b1e;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div style="font-size:48px">🍦</div>
      <div style="font-size:22px;color:#ff2e97;margin:12px 0;font-family:Orbitron,sans-serif;letter-spacing:2px">DATA LOAD ERROR</div>
      <div style="color:rgba(245,238,255,.55);font-size:14px">Deploy to Vercel, or run a local server:<br>
        <code style="background:rgba(255,255,255,.07);padding:5px 10px;border-radius:6px;font-size:12px;margin-top:8px;display:inline-block">python -m http.server 8000</code>
      </div>
      <div style="color:rgba(245,238,255,.28);font-size:11px;margin-top:12px">${err}</div>
    </div>`;
});
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
