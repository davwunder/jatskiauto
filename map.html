<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jätskiauto Helsinki Metro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <style>
    /* ── Palette ────────────────────────────────────────────────────────────
       Midnight sun dusk:
         --bg        deep navy/purple  #2c2a3e
         --surface   glass panels      rgba(44,40,64,0.82)
         --border    faint light       rgba(255,255,255,0.13)
         --active    warm pink         #ff6eb4
         --gold      golden hour       #ffb347
         --mint      ice-cream green   #7fffd4
         --inactive  warm sand         #c4a882
         --text      soft white        #f0eef8
         --muted     dimmed            rgba(240,238,248,0.5)
    ── */
    :root {
      --bg:       #2c2a3e;
      --surface:  rgba(44, 40, 64, 0.82);
      --border:   rgba(255, 255, 255, 0.13);
      --active:   #ff6eb4;
      --gold:     #ffb347;
      --mint:     #7fffd4;
      --text:     #f0eef8;
      --muted:    rgba(240, 238, 248, 0.5);
      --inactive: #c4a882;
      --radius:   16px;
      --font:     'Nunito', system-ui, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; background: var(--bg); font-family: var(--font); }

    /* ── Leaflet attribution dark ── */
    .leaflet-control-attribution {
      background: rgba(10,10,20,0.55) !important;
      color: rgba(255,255,255,0.35) !important;
      font-size: 10px !important;
    }
    .leaflet-control-attribution a { color: rgba(255,255,255,0.45) !important; }
    .leaflet-control-zoom a {
      background: var(--surface) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
      backdrop-filter: blur(12px);
    }
    .leaflet-control-zoom a:hover { background: rgba(255,110,180,0.25) !important; }

    /* ── Glassmorphism base ── */
    .glass {
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 6px 24px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.08);
    }

    /* ── Title ── */
    .ctrl-title {
      padding: 10px 20px;
      font-size: 19px;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      user-select: none;
      letter-spacing: .2px;
    }
    .ctrl-title span.ice  { color: var(--active); }
    .ctrl-title span.gold { color: var(--gold); }
    .ctrl-title .meta-updated {
      font-size: 10px;
      font-weight: 400;
      color: var(--muted);
      margin-top: 1px;
    }

    /* ── Date panel ── */
    .ctrl-datepanel {
      padding: 14px 16px;
      min-width: 200px;
    }
    .ctrl-datepanel .panel-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      margin-bottom: 9px;
    }
    .ctrl-datepanel input[type="date"] {
      width: 100%;
      font-family: var(--font);
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 11px;
      outline: none;
      cursor: pointer;
      background: rgba(255,255,255,0.06);
      transition: border-color .2s, background .2s;
      color-scheme: dark;
    }
    .ctrl-datepanel input[type="date"]:focus {
      border-color: var(--active);
      background: rgba(255,110,180,0.08);
    }
    .ctrl-datepanel .route-count {
      font-size: 13px;
      color: var(--muted);
      margin-top: 7px;
      min-height: 18px;
      transition: opacity .3s;
    }
    .ctrl-datepanel .route-count strong { color: var(--mint); }

    /* ── Live / back-to-today button ── */
    .btn-live {
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px solid rgba(255,110,180,0.4);
      border-radius: 14px;
      padding: 9px 16px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 700;
      color: var(--active);
      cursor: pointer;
      transition: background .2s, transform .15s, box-shadow .2s;
      white-space: nowrap;
      letter-spacing: .1px;
    }
    .btn-live:hover:not(.is-today) {
      background: rgba(255,110,180,0.15);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(255,110,180,.25);
    }
    .btn-live.is-today {
      color: var(--muted);
      border-color: var(--border);
      cursor: default;
    }
    .btn-live .pulse-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--active);
      animation: live-pulse 1.5s ease-in-out infinite;
      flex-shrink: 0;
    }
    .btn-live.is-today .pulse-dot { background: var(--muted); animation: none; }
    @keyframes live-pulse {
      0%, 100% { opacity: 1;  transform: scale(1); }
      50%       { opacity: .3; transform: scale(.6); }
    }

    /* ── Geolocation button ── */
    .btn-geo {
      width: 42px; height: 42px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 19px;
      cursor: pointer;
      border: 1px solid rgba(127,255,212,0.35);
      transition: background .2s, transform .15s, box-shadow .2s;
    }
    .btn-geo:hover {
      background: rgba(127,255,212,0.15) !important;
      transform: scale(1.1);
      box-shadow: 0 4px 16px rgba(127,255,212,.2);
    }
    .btn-geo:active { transform: scale(.92); }

    /* ── Glowing stop dot ── */
    .stop-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--active);
      box-shadow: 0 0 0 3px rgba(255,110,180,.25), 0 0 12px rgba(255,110,180,.5);
      transition: transform .2s ease, box-shadow .2s ease;
      cursor: pointer;
    }
    .stop-dot:hover {
      transform: scale(1.7);
      box-shadow: 0 0 0 4px rgba(255,110,180,.35), 0 0 20px rgba(255,110,180,.7);
    }
    .stop-dot.inactive {
      background: var(--inactive);
      opacity: 0.45;
      box-shadow: none;
    }
    .stop-dot.inactive:hover {
      transform: scale(1.5);
      opacity: 0.8;
      box-shadow: 0 0 8px rgba(196,168,130,.4);
    }

    /* ── Stop time states (today only) ── */
    .stop-dot.soon {
      background: var(--gold);
      box-shadow: 0 0 0 3px rgba(255,179,71,.3), 0 0 14px rgba(255,179,71,.6);
      animation: soon-pulse 2s ease-in-out infinite;
    }
    .stop-dot.now {
      background: var(--mint);
      box-shadow: 0 0 0 4px rgba(127,255,212,.35), 0 0 18px rgba(127,255,212,.7);
      animation: now-pulse 1s ease-in-out infinite;
    }
    .stop-dot.past {
      background: #776e8a;
      opacity: 0.3;
      box-shadow: none;
    }
    @keyframes soon-pulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(255,179,71,.3), 0 0 14px rgba(255,179,71,.6); }
      50%       { box-shadow: 0 0 0 6px rgba(255,179,71,.15), 0 0 22px rgba(255,179,71,.4); }
    }
    @keyframes now-pulse {
      0%, 100% { box-shadow: 0 0 0 4px rgba(127,255,212,.35), 0 0 18px rgba(127,255,212,.7); transform: scale(1); }
      50%       { box-shadow: 0 0 0 8px rgba(127,255,212,.2), 0 0 26px rgba(127,255,212,.5); transform: scale(1.2); }
    }

    /* ── Truck marker ── */
    .truck-marker {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, #ff6eb4, #ffb347);
      border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,0.9);
      box-shadow: 0 0 0 4px rgba(255,110,180,.3), 0 4px 16px rgba(0,0,0,.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      animation: truck-bounce 1.8s ease-in-out infinite;
    }
    @keyframes truck-bounce {
      0%, 100% { transform: translateY(0)   scale(1);    box-shadow: 0 0 0 4px rgba(255,110,180,.3), 0 4px 16px rgba(0,0,0,.4); }
      40%       { transform: translateY(-5px) scale(1.08); box-shadow: 0 0 0 6px rgba(255,110,180,.2), 0 10px 24px rgba(0,0,0,.3); }
      60%       { transform: translateY(-3px) scale(1.05); }
    }

    /* ── Popup ── */
    .leaflet-popup-content-wrapper {
      background: rgba(38, 34, 58, 0.92) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border: 1px solid rgba(255,255,255,0.1) !important;
      border-radius: 16px !important;
      box-shadow: 0 8px 32px rgba(0,0,0,.6) !important;
      padding: 0 !important;
      overflow: hidden;
      animation: popup-in .2s ease;
    }
    @keyframes popup-in {
      from { opacity: 0; transform: translateY(6px) scale(.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }
    .leaflet-popup-content { margin: 0 !important; width: auto !important; }
    .leaflet-popup-tip-container { display: none; }
    .leaflet-popup-close-button {
      color: var(--muted) !important;
      font-size: 18px !important;
      padding: 6px 8px !important;
    }
    .leaflet-popup-close-button:hover { color: var(--text) !important; }

    .popup-stop { font-family: var(--font); min-width: 200px; }
    .popup-header {
      background: linear-gradient(135deg, rgba(255,110,180,.25), rgba(255,179,71,.18));
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding: 12px 16px 10px;
    }
    .popup-header .stop-name {
      font-size: 15px; font-weight: 700;
      color: var(--text); line-height: 1.2;
    }
    .popup-header .stop-zip {
      font-size: 11px; color: var(--muted); margin-top: 2px;
    }
    .popup-body { padding: 11px 16px 14px; }

    .popup-time-box {
      display: flex; align-items: center; gap: 10px;
      border-radius: 10px; padding: 7px 11px; margin-bottom: 10px;
    }
    .popup-time-box.today {
      background: rgba(255,110,180,.12);
      border: 1px solid rgba(255,110,180,.3);
    }
    .popup-time-box.other-day {
      background: rgba(127,255,212,.08);
      border: 1px solid rgba(127,255,212,.25);
    }
    .popup-time-box .tbox-label {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .8px;
    }
    .popup-time-box.today    .tbox-label { color: var(--active); }
    .popup-time-box.other-day .tbox-label { color: var(--mint); }
    .popup-time-box .tbox-time {
      font-size: 22px; font-weight: 800; line-height: 1;
    }
    .popup-time-box.today    .tbox-time { color: var(--active); }
    .popup-time-box.other-day .tbox-time { color: var(--mint); }

    .popup-upcoming .upcoming-title {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .8px;
      color: var(--muted); margin-bottom: 5px;
    }
    .popup-upcoming .upcoming-row {
      display: flex; justify-content: space-between; gap: 12px;
      font-size: 12px; color: rgba(232,230,240,.65); padding: 3px 0;
      border-bottom: 1px solid rgba(255,255,255,.05);
    }
    .popup-upcoming .upcoming-row:last-child { border-bottom: none; }
    .popup-phone {
      margin-top: 9px; font-size: 12px;
      color: rgba(232,230,240,.35);
    }
    .popup-copy-btn {
      display: block; width: 100%; margin-top: 9px;
      padding: 6px 10px;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: var(--font); font-size: 12px;
      cursor: pointer; text-align: center;
      transition: background .15s, color .15s;
    }
    .popup-copy-btn:hover { background: rgba(127,255,212,.12); color: var(--mint); }

    /* ── Tooltip ── */
    .leaflet-tooltip {
      background: rgba(20,18,38,.85) !important;
      backdrop-filter: blur(10px);
      border: 1px solid var(--border) !important;
      border-radius: 8px !important;
      color: var(--text) !important;
      font-family: var(--font) !important;
      font-size: 12px !important;
      box-shadow: 0 4px 12px rgba(0,0,0,.4) !important;
    }
    .leaflet-tooltip-top::before { border-top-color: rgba(20,18,38,.85) !important; }

    /* ── Marker cluster custom icons ── */
    .jatski-cluster {
      background: rgba(44,40,64,0.90);
      border: 2px solid rgba(255,110,180,0.45);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--active);
      font-family: var(--font); font-weight: 700;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 10px rgba(255,110,180,.2);
    }
    .jatski-cluster-sm { width: 30px; height: 30px; font-size: 11px; }
    .jatski-cluster-md { width: 40px; height: 40px; font-size: 13px; }
    .jatski-cluster-lg {
      width: 50px; height: 50px; font-size: 15px;
      border-color: rgba(255,179,71,0.5);
      color: var(--gold);
      box-shadow: 0 0 14px rgba(255,179,71,.25);
    }
  </style>
</head>
<body>
<div id="map"></div>
<script>
// ── Constants ────────────────────────────────────────────────────────────────

const ACTIVE_COLOR   = '#ff6eb4';
const INACTIVE_COLOR = '#c4a882';

const DWELL_MIN  = 3;
const APPEAR_MIN = 5;
const VANISH_MIN = 5;

// ── Map init ─────────────────────────────────────────────────────────────────

const map = L.map('map', { zoomControl: true }).setView([60.25, 24.90], 11);

// Voyager tiles with a CSS twilight filter applied via the pane
map.createPane('tiles');
map.getPane('tiles').style.filter = 'brightness(0.72) saturate(0.55) hue-rotate(200deg) sepia(0.18)';
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19, pane: 'tiles',
}).addTo(map);

// ── Helpers ───────────────────────────────────────────────────────────────────

function isoToday() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function toMin(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
}

function nowMin() {
  const n = new Date();
  return n.getHours() * 60 + n.getMinutes() + n.getSeconds() / 60;
}

function formatDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('fi-FI', { weekday: 'short', day: 'numeric', month: 'short' });
}

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371, toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/** Schedules on or after a given ISO date, sorted, first N */
function upcomingFrom(schedules, fromISO, n = 4) {
  return schedules
    .filter(s => s.date >= fromISO)
    .sort((a, b) => a.date.localeCompare(b.date))
    .slice(0, n);
}

/** Returns 'now' | 'soon' | 'past' | '' for a stop given current time t (minutes) */
function stopTimeState(stop, iso, t) {
  const sc = (stop.schedules || []).find(s => s.date === iso);
  if (!sc) return '';
  const arrMin = toMin(sc.time);
  if (t >= arrMin && t <= arrMin + DWELL_MIN) return 'now';
  if (t > arrMin + DWELL_MIN) return 'past';
  if (t >= arrMin - 30) return 'soon';
  return '';
}

function stopPopup(stop, selectedISO) {
  const schedules  = stop.schedules || [];
  const todayISO   = isoToday();
  const selSched   = schedules.find(s => s.date === selectedISO);
  const isToday    = selectedISO === todayISO;
  const upcoming   = upcomingFrom(schedules.filter(s => s.date !== selectedISO), selectedISO);

  const hashVal = `stop=${encodeURIComponent(stop.name)}&zip=${stop.zip}`;

  let html = `<div class="popup-stop">
    <div class="popup-header">
      <div class="stop-name">${stop.name}</div>
      <div class="stop-zip">${stop.zip}</div>
    </div>
    <div class="popup-body">`;

  if (selSched) {
    if (isToday) {
      html += `<div class="popup-time-box today">
        <div><div class="tbox-label">Tänään</div><div class="tbox-time">${selSched.time}</div></div>
      </div>`;
    } else {
      const label = formatDate(selectedISO);
      html += `<div class="popup-time-box other-day">
        <div><div class="tbox-label">${label}</div><div class="tbox-time">${selSched.time}</div></div>
      </div>`;
    }
  }

  if (upcoming.length) {
    html += `<div class="popup-upcoming">
      <div class="upcoming-title">Seuraavat käynnit</div>`;
    upcoming.forEach(s => {
      html += `<div class="upcoming-row"><span>${formatDate(s.date)}</span><span>${s.time}</span></div>`;
    });
    html += `</div>`;
  }

  if (stop.phone) html += `<div class="popup-phone">📞 ${stop.phone}</div>`;

  html += `<button class="popup-copy-btn" onclick="copyStopLink('${hashVal}')">🔗 Kopioi linkki</button>`;
  html += `</div></div>`;
  return html;
}

function copyStopLink(hashVal) {
  const url = location.href.split('#')[0] + '#' + hashVal;
  navigator.clipboard.writeText(url).catch(() => {
    // Fallback: select temp input
    const inp = document.createElement('input');
    inp.value = url;
    document.body.appendChild(inp);
    inp.select();
    document.execCommand('copy');
    document.body.removeChild(inp);
  });
}

// ── Routed polyline geometry ──────────────────────────────────────────────────

/**
 * Build the array of [lat, lon] points for a route's polyline.
 * If stops have path_to_next (OSRM road geometry), stitch those together.
 * Falls back to straight stop-to-stop lines if path_to_next is absent.
 */
function buildRoutedLatlngs(stops) {
  // Check if any stop has road geometry
  const hasRouting = stops.some(s => Array.isArray(s.path_to_next) && s.path_to_next.length > 0);
  if (!hasRouting) {
    return stops.map(s => [s.lat, s.lon]);
  }
  const pts = [[stops[0].lat, stops[0].lon]];
  for (let i = 0; i < stops.length - 1; i++) {
    const leg = stops[i].path_to_next;
    if (Array.isArray(leg) && leg.length > 0) {
      // leg already starts at stops[i] position — skip first point to avoid duplicates
      leg.slice(1).forEach(p => pts.push(p));
    } else {
      // Fallback straight line to next stop
      pts.push([stops[i + 1].lat, stops[i + 1].lon]);
    }
  }
  return pts;
}

// ── Truck position ────────────────────────────────────────────────────────────

function getTruckPosition(stops, stopTimesMin, t) {
  if (!stopTimesMin.length) return null;
  const first = stopTimesMin[0], last = stopTimesMin[stopTimesMin.length - 1];
  if (t < first - APPEAR_MIN || t > last + VANISH_MIN) return null;
  if (t < first) return { lat: stops[0].lat, lon: stops[0].lon };
  for (let i = 0; i < stopTimesMin.length; i++) {
    const arrive = stopTimesMin[i], depart = arrive + DWELL_MIN;
    if (t >= arrive && t <= depart) return { lat: stops[i].lat, lon: stops[i].lon };
    if (i + 1 < stopTimesMin.length) {
      const next = stopTimesMin[i + 1];
      if (t > depart && t < next) {
        const p = (t - depart) / (next - depart);
        return {
          lat: stops[i].lat + p * (stops[i+1].lat - stops[i].lat),
          lon: stops[i].lon + p * (stops[i+1].lon - stops[i].lon),
        };
      }
    }
  }
  return { lat: stops[stops.length-1].lat, lon: stops[stops.length-1].lon };
}

function makeStopIcon(active, timeState) {
  let cls = 'stop-dot';
  if (!active) {
    cls += ' inactive';
  } else if (timeState) {
    cls += ' ' + timeState;
  }
  return L.divIcon({
    html: `<div class="${cls}"></div>`,
    className: '',
    iconSize: [12, 12],
    iconAnchor: [6, 6],
  });
}

function makeTruckIcon() {
  return L.divIcon({
    html: '<div class="truck-marker">🍦</div>',
    className: '', iconSize: [38,38], iconAnchor: [19,19],
  });
}

// ── State ────────────────────────────────────────────────────────────────────

let allRoutes    = [];
let routeLayers  = [];   // { polyline, markers[], route }
let truckMarkers = {};
let truckTrails  = {};   // rid → [L.polyline, ...]  fading trail segments
let truckTrailBuf= {};   // rid → [ {lat,lon}, ... ] rolling buffer of last 5 positions
let selectedISO  = isoToday();
let animTimer    = null;
let routeCountEl, liveBtn, dateInput;
let clusterGroup;
let revealTimers = [];   // clearable timers for animated route reveal

// ── Cluster group factory ─────────────────────────────────────────────────────

function makeCluster() {
  return L.markerClusterGroup({
    maxClusterRadius: 40,
    disableClusteringAtZoom: 14,
    spiderfyOnMaxZoom: true,
    iconCreateFunction(cluster) {
      const n = cluster.getChildCount();
      let sz = 'sm', w = 30;
      if (n >= 50)  { sz = 'lg'; w = 50; }
      else if (n >= 15) { sz = 'md'; w = 40; }
      return L.divIcon({
        html: `<div class="jatski-cluster jatski-cluster-${sz}">${n}</div>`,
        className: '',
        iconSize: [w, w],
        iconAnchor: [w/2, w/2],
      });
    },
  });
}

// ── Animated reveal helpers ───────────────────────────────────────────────────

function clearRevealTimers() {
  revealTimers.forEach(id => clearTimeout(id));
  revealTimers = [];
}

// ── renderDate ────────────────────────────────────────────────────────────────

function renderDate(iso) {
  selectedISO = iso;
  const todayISO = isoToday();
  const isLive   = iso === todayISO;
  const t        = isLive ? nowMin() : -1;

  clearRevealTimers();

  // Separate active / inactive routes for staggered reveal
  const active   = routeLayers.filter(({ route }) =>
    route.stops.some(s => (s.schedules || []).some(sc => sc.date === iso))
  );
  const inactive = routeLayers.filter(({ route }) =>
    !route.stops.some(s => (s.schedules || []).some(sc => sc.date === iso))
  );

  // Instantly dim inactive routes
  inactive.forEach(({ polyline, markers, route }) => {
    polyline.setStyle({ color: INACTIVE_COLOR, weight: 1.5, opacity: 0.35 });
    markers.forEach(m => {
      m.setIcon(makeStopIcon(false, ''));
      m.setPopupContent(stopPopup(m._stop, iso));
    });
  });

  // Stagger-reveal active routes (50 ms apart, max 30 at once then batch)
  active.forEach(({ polyline, markers, route }, i) => {
    polyline.setStyle({ color: ACTIVE_COLOR, weight: 4, opacity: 0 });
    const id = setTimeout(() => {
      polyline.setStyle({ opacity: 0.9 });
      markers.forEach(m => {
        const ts = isLive ? stopTimeState(m._stop, iso, t) : '';
        m.setIcon(makeStopIcon(true, ts));
        m.setPopupContent(stopPopup(m._stop, iso));
      });
    }, Math.min(i, 60) * 40);
    revealTimers.push(id);
  });

  // Active route count
  const activeCount = active.length;
  routeCountEl.innerHTML = activeCount > 0
    ? `<strong>${activeCount}</strong> reitti${activeCount !== 1 ? 'ä' : ''} ajossa`
    : `<span style="color:#ccc">Ei reittejä tälle päivälle</span>`;

  // Live button state
  liveBtn.classList.toggle('is-today', isLive);

  // Trucks: only animate for today
  if (animTimer) { clearInterval(animTimer); animTimer = null; }
  Object.values(truckMarkers).forEach(m => { if (map.hasLayer(m)) map.removeLayer(m); });
  Object.values(truckTrails).forEach(segs => segs.forEach(pl => { if (map.hasLayer(pl)) map.removeLayer(pl); }));
  truckMarkers = {};
  truckTrails  = {};
  truckTrailBuf= {};

  if (isLive) {
    const todayRoutes = active;
    const routeMeta = todayRoutes.map(({ route }) => {
      const stops = route.stops;
      const timesMin = stops.map(stop => {
        const sc = (stop.schedules || []).find(s => s.date === todayISO);
        return sc ? toMin(sc.time) : null;
      }).filter(t => t !== null);
      return { route, stops, timesMin };
    });

    function updateTrucks() {
      const now = nowMin();
      routeMeta.forEach(({ route, stops, timesMin }) => {
        const pos = getTruckPosition(stops, timesMin, now);
        const rid = route.route_id;
        if (pos) {
          // Update / create truck marker
          if (!truckMarkers[rid]) {
            truckMarkers[rid] = L.marker([pos.lat, pos.lon], {
              icon: makeTruckIcon(), zIndexOffset: 1000,
            }).addTo(map).bindTooltip(
              `<span style="font-family:Nunito,sans-serif">${route.route_id}</span>`
            );
          } else {
            truckMarkers[rid].setLatLng([pos.lat, pos.lon]);
            if (!map.hasLayer(truckMarkers[rid])) truckMarkers[rid].addTo(map);
          }

          // Truck trail: rolling buffer of last 5 positions
          if (!truckTrailBuf[rid]) truckTrailBuf[rid] = [];
          const buf = truckTrailBuf[rid];
          buf.push([pos.lat, pos.lon]);
          if (buf.length > 6) buf.shift();

          // Remove old trail segments
          if (truckTrails[rid]) {
            truckTrails[rid].forEach(pl => { if (map.hasLayer(pl)) map.removeLayer(pl); });
          }
          truckTrails[rid] = [];

          // Draw new trail: N-1 short polylines with decreasing opacity
          const opacities = [0.65, 0.45, 0.28, 0.14, 0.06];
          for (let j = 0; j < buf.length - 1; j++) {
            const seg = L.polyline([buf[j], buf[j+1]], {
              color: ACTIVE_COLOR,
              weight: 3,
              opacity: opacities[Math.max(0, opacities.length - (buf.length - 1) + j)],
              interactive: false,
            }).addTo(map);
            truckTrails[rid].push(seg);
          }

        } else if (truckMarkers[rid] && map.hasLayer(truckMarkers[rid])) {
          map.removeLayer(truckMarkers[rid]);
          if (truckTrails[rid]) {
            truckTrails[rid].forEach(pl => { if (map.hasLayer(pl)) map.removeLayer(pl); });
            delete truckTrails[rid];
            delete truckTrailBuf[rid];
          }
        }
      });

      // Update stop glow states for today
      const t2 = nowMin();
      routeLayers.forEach(({ markers, route }) => {
        const active2 = route.stops.some(s => (s.schedules || []).some(sc => sc.date === todayISO));
        if (active2) {
          markers.forEach(m => {
            const ts = stopTimeState(m._stop, todayISO, t2);
            m.setIcon(makeStopIcon(true, ts));
          });
        }
      });
    }

    updateTrucks();
    animTimer = setInterval(updateTrucks, 30_000);
  }
}

// ── Polyline hover (route highlight) ─────────────────────────────────────────

function attachHover(polyline, route) {
  let hoverActive = false;
  polyline.on('mouseover', () => {
    hoverActive = true;
    const isActive = route.stops.some(s => (s.schedules || []).some(sc => sc.date === selectedISO));
    if (!isActive) return;
    polyline.setStyle({ weight: 7, opacity: 1.0 });
    polyline.bringToFront();
    const stopCount = route.stops.length;
    const day = route.weekday
      ? route.weekday.charAt(0).toUpperCase() + route.weekday.slice(1)
      : '?';
    polyline.bindTooltip(
      `<strong>${route.route_id}</strong><br>${day} · ${stopCount} pysäkkiä`,
      { sticky: true, direction: 'top' }
    ).openTooltip();
  });
  polyline.on('mouseout', () => {
    hoverActive = false;
    const isActive = route.stops.some(s => (s.schedules || []).some(sc => sc.date === selectedISO));
    polyline.setStyle({
      weight:  isActive ? 4 : 1.5,
      opacity: isActive ? 0.9 : 0.35,
    });
    polyline.closeTooltip();
  });
}

// ── Geolocation ───────────────────────────────────────────────────────────────

function findNearestStop(userLat, userLon) {
  let best = null, bestDist = Infinity, bestMarker = null;
  routeLayers.forEach(({ markers, route }) => {
    const active = route.stops.some(s => (s.schedules || []).some(sc => sc.date === selectedISO));
    if (!active) return;
    markers.forEach(m => {
      const ll = m.getLatLng();
      const d  = haversineKm(userLat, userLon, ll.lat, ll.lng);
      if (d < bestDist) { bestDist = d; best = m._stop; bestMarker = m; }
    });
  });
  return { stop: best, marker: bestMarker, distKm: bestDist };
}

// ── URL hash sharing ──────────────────────────────────────────────────────────

function parseHash() {
  const hash = location.hash.slice(1);
  if (!hash) return null;
  const p = new URLSearchParams(hash);
  return { name: p.get('stop'), zip: p.get('zip') };
}

function openStopFromHash() {
  const h = parseHash();
  if (!h || !h.name) return;
  for (const { markers } of routeLayers) {
    for (const m of markers) {
      if (m._stop.name === h.name && (!h.zip || m._stop.zip === h.zip)) {
        // Zoom to show the marker and open its popup
        clusterGroup.zoomToShowLayer(m, () => {
          m.openPopup();
          map.panTo(m.getLatLng());
        });
        return;
      }
    }
  }
}

// ── Main ─────────────────────────────────────────────────────────────────────

// Try static data.js bundle first (GitHub Pages), then fetch JSON
const dataPromise = (typeof window.ROUTE_DATA !== 'undefined')
  ? Promise.resolve(window.ROUTE_DATA)
  : fetch('./metro_ice_cream_routes.json?v=' + Date.now()).then(r => r.json());

// Also load meta.json for last-updated display
const metaPromise = fetch('./meta.json?v=' + Date.now())
  .then(r => r.json())
  .catch(() => null);

Promise.all([dataPromise, metaPromise])
  .then(([data, meta]) => {
    allRoutes = Array.isArray(data) ? data : Object.values(data);

    // ── Title ──────────────────────────────────────────────────────────────
    new (L.Control.extend({
      onAdd() {
        const d = document.createElement('div');
        d.className = 'ctrl-title glass';
        let inner = '🍦 <span class="ice">Jätski</span><span class="gold">auto</span> Helsinki Metro';
        if (meta && meta.generated) {
          inner += `<div class="meta-updated">Päivitetty ${meta.generated} · ${meta.routes} reittiä · ${meta.stops} pysäkkiä</div>`;
        }
        d.innerHTML = inner;
        return d;
      }
    }))({ position: 'topleft' }).addTo(map);

    // ── Date panel ─────────────────────────────────────────────────────────
    new (L.Control.extend({
      onAdd() {
        const wrap = document.createElement('div');
        wrap.className = 'ctrl-datepanel glass';

        const title = document.createElement('div');
        title.className = 'panel-title';
        title.textContent = 'Näytä reitit päivälle';
        wrap.appendChild(title);

        dateInput = document.createElement('input');
        dateInput.type = 'date';
        dateInput.value = isoToday();
        dateInput.min = '2026-04-09';
        dateInput.max = '2026-09-30';
        dateInput.addEventListener('change', () => {
          if (dateInput.value) renderDate(dateInput.value);
        });
        wrap.appendChild(dateInput);

        routeCountEl = document.createElement('div');
        routeCountEl.className = 'route-count';
        wrap.appendChild(routeCountEl);

        return wrap;
      }
    }))({ position: 'topright' }).addTo(map);

    // ── Live button ────────────────────────────────────────────────────────
    new (L.Control.extend({
      onAdd() {
        liveBtn = document.createElement('button');
        liveBtn.className = 'btn-live glass is-today';
        liveBtn.innerHTML = '<span class="pulse-dot"></span> Takaisin tähän päivään';
        liveBtn.addEventListener('click', () => {
          const t = isoToday();
          dateInput.value = t;
          renderDate(t);
        });
        L.DomEvent.disableClickPropagation(liveBtn);
        L.DomEvent.disableScrollPropagation(liveBtn);
        return liveBtn;
      }
    }))({ position: 'bottomright' }).addTo(map);

    // ── Geolocation button ─────────────────────────────────────────────────
    new (L.Control.extend({
      onAdd() {
        const btn = document.createElement('button');
        btn.className = 'btn-geo glass';
        btn.title = 'Lähin jätskiauto';
        btn.textContent = '📍';
        btn.addEventListener('click', () => {
          if (!navigator.geolocation) {
            alert('Sijainti ei ole käytössä tässä selaimessa.');
            return;
          }
          btn.textContent = '⏳';
          navigator.geolocation.getCurrentPosition(
            pos => {
              btn.textContent = '📍';
              const { latitude: lat, longitude: lon } = pos.coords;

              // Show user dot
              L.circleMarker([lat, lon], {
                radius: 8, color: '#7fffd4', fillColor: '#7fffd4',
                fillOpacity: 0.6, weight: 2,
                interactive: false,
              }).addTo(map).bindTooltip('Sijaintisi', { direction: 'top' });

              const { stop, marker, distKm } = findNearestStop(lat, lon);
              if (!stop) {
                alert('Ei aktiivisia reittejä tänään.');
                return;
              }
              const walkMin = Math.round(distKm / 5 * 60);
              map.setView([stop.lat, stop.lon], 15);
              clusterGroup.zoomToShowLayer(marker, () => {
                marker.openPopup();
                map.panTo(marker.getLatLng());
              });
              // Brief walk-time tooltip on user dot
              const sc = (stop.schedules || []).find(s => s.date === selectedISO);
              if (sc) {
                L.popup({ closeButton: false, autoClose: true, autoPan: false })
                  .setLatLng([lat, lon])
                  .setContent(`<span style="font-family:Nunito,sans-serif;font-size:12px">🚶 ${walkMin} min kävelyä<br>${stop.name} klo ${sc.time}</span>`)
                  .openOn(map);
              }
            },
            err => {
              btn.textContent = '📍';
              alert('Sijainnin haku epäonnistui: ' + err.message);
            },
            { timeout: 10000 }
          );
        });
        L.DomEvent.disableClickPropagation(btn);
        L.DomEvent.disableScrollPropagation(btn);
        return btn;
      }
    }))({ position: 'bottomleft' }).addTo(map);

    // ── Cluster group ──────────────────────────────────────────────────────
    clusterGroup = makeCluster();
    clusterGroup.addTo(map);

    // ── Build route layers ─────────────────────────────────────────────────
    allRoutes.forEach(route => {
      const stops = route.stops;
      if (!stops.length) return;

      // Build polyline: use OSRM road geometry if available, else straight lines
      const latlngs = buildRoutedLatlngs(stops);
      const polyline  = L.polyline(latlngs, {
        color: INACTIVE_COLOR, weight: 1.5, opacity: 0.35,
      }).addTo(map);

      attachHover(polyline, route);

      const markers = stops.map(stop => {
        const m = L.marker([stop.lat, stop.lon], {
          icon: makeStopIcon(false, ''),
          zIndexOffset: 100,
        });
        m._stop = stop;
        m.bindPopup(stopPopup(stop, selectedISO), { maxWidth: 260 });
        // Set URL hash when popup opens
        m.on('popupopen', () => {
          history.replaceState(null, '', '#stop=' + encodeURIComponent(stop.name) + '&zip=' + stop.zip);
        });
        m.on('popupclose', () => {
          history.replaceState(null, '', location.pathname + location.search);
        });
        clusterGroup.addLayer(m);
        return m;
      });

      routeLayers.push({ polyline, markers, route });
    });

    // Initial render for today
    renderDate(isoToday());

    // Restore stop from URL hash (after a short delay for clusters to settle)
    setTimeout(openStopFromHash, 400);
  })
  .catch(err => {
    console.error(err);
    document.body.innerHTML =
      `<div style="padding:3em;font-family:Nunito,sans-serif;text-align:center;color:#f0eef8;background:#2c2a3e;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div style="font-size:48px">🍦</div>
        <div style="font-size:22px;color:#ff6fb0;margin:12px 0">Reittitietojen lataus epäonnistui</div>
        <div style="color:#888;font-size:14px">Käynnistä ensin paikallinen palvelin:<br>
        <code style="background:rgba(255,255,255,.08);padding:4px 8px;border-radius:4px;font-size:13px">
          python -m http.server 8000</code></div>
        <div style="color:#ccc;font-size:12px;margin-top:12px">${err}</div>
      </div>`;
  });
</script>
</body>
</html>
